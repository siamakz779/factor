<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4f91">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font-size:14px}[hidden]{display:none!important}</style>
<title>دفتر فاکتور</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow column (max 720px). Sticky title + tabs, cards for lists and forms,
   and the invoice itself as a white paper sheet (1000px wide) scaled to fit the screen. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface2:#e8ecf4; --ink:#101b33; --muted:#566280; --line:#d3dae8;
  --accent:#1f4f91; --accent-ink:#ffffff; --accent-soft:#e1eaf8;
  --me:#0c7358; --me-soft:#dcf1e8; --friend:#97500a; --friend-soft:#fbeed6;
  --bad:#b3261e; --bad-soft:#fbe4e2;
  --font:'Vazirmatn',Tahoma,'Noto Naskh Arabic','Noto Sans Arabic','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424; --surface:#161e33; --surface2:#202b47; --ink:#e8edf8; --muted:#9ba8c6; --line:#2c3858;
    --accent:#86b4f6; --accent-ink:#0b1730; --accent-soft:#1c2c4b;
    --me:#4fd1a5; --me-soft:#12372d; --friend:#f0b35c; --friend-soft:#3a2a10;
    --bad:#ff8f86; --bad-soft:#3c1b19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#161e33; --surface2:#202b47; --ink:#e8edf8; --muted:#9ba8c6; --line:#2c3858;
  --accent:#86b4f6; --accent-ink:#0b1730; --accent-soft:#1c2c4b;
  --me:#4fd1a5; --me-soft:#12372d; --friend:#f0b35c; --friend-soft:#3a2a10;
  --bad:#ff8f86; --bad-soft:#3c1b19; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;direction:rtl;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
.muted{color:var(--muted)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 0;border-bottom:1px solid var(--line)}
.top h1{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:0}
.tabs{display:flex;gap:4px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:8px 4px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--friend-soft);color:var(--friend);font-size:13px}
main{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1 1 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-size:17px;font-weight:700}
.panel h3{margin:0;font-size:15px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.span2{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.f input,.f textarea,.f select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;width:100%;min-width:0}
.f textarea{resize:vertical}
.ltr{direction:ltr;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:36px}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum-grid>div{background:var(--bg);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;min-width:0}
.sum-grid span{font-size:12px;color:var(--muted)}
.sum-grid b{font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sum-grid .me{background:var(--me-soft)} .sum-grid .me span,.sum-grid .me b{color:var(--me)}
.sum-grid .friend{background:var(--friend-soft)} .sum-grid .friend span,.sum-grid .friend b{color:var(--friend)}
.doc,.cust{display:flex;flex-direction:column;gap:2px;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.doc-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.doc-top .muted{margin-inline-start:auto;font-size:13px}
.doc-name{font-weight:700}
.doc-bot{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:0 8px}
.badge.inv{background:var(--accent-soft);color:var(--accent)}
.badge.pro{background:var(--surface2);color:var(--muted);border:1px dashed var(--muted)}
.me-t{color:var(--me);font-weight:600} .fr-t{color:var(--friend);font-weight:600}
.empty{margin:24px 0;text-align:center;color:var(--muted)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.item-h{display:flex;justify-content:space-between;align-items:center}
.line-sum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.buyer-card{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:10px 12px}
.picker{display:flex;flex-direction:column;gap:8px}
.picker input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}
.clist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.cust{padding:8px 12px}
.rows{display:flex;flex-direction:column}
.rows>div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.rows>div:last-child{border-bottom:0}
.rows b{text-align:left}
.grand{font-size:18px}
.words{font-size:13px;color:var(--muted)}
.share{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share>div{border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.share .fr{background:var(--friend-soft);color:var(--friend)}
.share .me{background:var(--me-soft);color:var(--me)}
.share span{font-size:12px}
.share b{font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--muted)}
.pay{display:flex;gap:16px}
.pay label{display:flex;gap:6px;align-items:center}
.sheet-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.head-row{display:flex;gap:10px;align-items:center}
.head-row h2{margin:0;font-size:18px}
.stamp-prev{max-height:130px;max-width:100%;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;align-self:flex-start}
details>summary{cursor:pointer;font-weight:700;min-height:36px}
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 16px;font-size:14px}
.toast.err{background:var(--bad);color:#fff}
.modal{position:fixed;inset:0;background:rgba(10,16,32,.55);display:flex;align-items:center;justify-content:center;z-index:40;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.dlg p{margin:0}
.dlg .row{display:flex;gap:8px}
.dlg .row .btn{flex:1}
.dlg.wide{max-width:560px;max-height:88vh}
.dlg.wide .clist{max-height:55vh}
.dlg.wide input[type="search"]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}
.item-h .btns{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-size:14px;white-space:nowrap}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600}
.tbl td.n{text-align:left}
.bal{font-size:12px;font-weight:700;border-radius:6px;padding:0 8px;font-variant-numeric:tabular-nums}
.bal.owed{background:var(--friend-soft);color:var(--friend)}
.bal.ok{background:var(--me-soft);color:var(--me)}
.bal.cred{background:var(--accent-soft);color:var(--accent)}
.bal-big{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-radius:10px;padding:10px 14px;flex-wrap:wrap}
.bal-big b{font-size:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bal-big.owed{background:var(--friend-soft);color:var(--friend)}
.bal-big.ok{background:var(--me-soft);color:var(--me)}
.bal-big.cred{background:var(--accent-soft);color:var(--accent)}
.cust .row2{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

@media print{
  :root:not([data-theme="x"]),:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface2:#eee;--ink:#000;--muted:#333;--line:#999;--accent:#000;--accent-soft:#eee;--me:#000;--me-soft:#eee;--friend:#000;--friend-soft:#eee;color-scheme:light}
  html,body{background:#fff!important}
  body{padding:0!important;margin:0!important}
  body::before,.top,#banner,#toasts,.modal,.tabs{display:none!important}
  body:not(.pr-stmt) main>*:not(.sheet-wrap){display:none!important}
  body.pr-stmt .actions,body.pr-stmt .head-row{display:none!important}
  main{padding:0!important}
  .wrap{max-width:none!important;margin:0!important;width:auto!important}
  .sheet-wrap{border:0!important;border-radius:0!important;overflow:visible!important;width:auto!important}
  .sheet{zoom:1!important;margin:0 auto!important}
  .panel{break-inside:avoid;border:1px solid #999!important}
  .tbl{overflow:visible!important}
  @page{size:A4 landscape;margin:8mm}
}
</style>

<body>

<div id="app" dir="rtl" lang="fa">
  <div class="wrap">
    <header class="top">
      <h1>دفتر فاکتور</h1>
      <nav class="tabs" aria-label="بخش‌ها">
        <button class="tab" data-act="go" data-to="docs" id="tab-docs">اسناد</button>
        <button class="tab" data-act="go" data-to="customers" id="tab-customers">مشتریان</button>
        <button class="tab" data-act="go" data-to="catalog" id="tab-catalog">کالا و خدمات</button>
        <button class="tab" data-act="go" data-to="settings" id="tab-settings">تنظیمات</button>
      </nav>
    </header>
    <div id="banner"></div>
    <main id="main"><p class="empty">در حال بارگذاری…</p></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
</div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<input type="file" id="stampfile" accept="image/*" hidden>

<script>
(function(){
'use strict';
document.documentElement.dir='rtl';
document.documentElement.lang='fa';

/*LOGIC-START*/
const FA='۰۱۲۳۴۵۶۷۸۹';
const AR='٠١٢٣٤٥٦٧٨٩';
function toFa(s){return String(s==null?'':s).replace(/\d/g,function(d){return FA[+d];});}
function toEn(s){return String(s==null?'':s).replace(/[۰-۹]/g,function(d){return String(FA.indexOf(d));}).replace(/[٠-٩]/g,function(d){return String(AR.indexOf(d));}).replace(/٫/g,'.').replace(/[٬،]/g,',');}
function parseNum(s){var t=toEn(s).replace(/[,\s]/g,'');var n=parseFloat(t);return isFinite(n)?n:0;}
function fmt(n){n=Math.round(+n||0);var neg=n<0;var s=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');return toFa((neg?'-':'')+s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fa(s){return esc(toFa(s));}

function div(a,b){return ~~(a/b);}
function mod(a,b){return a-~~(a/b)*b;}
var BREAKS=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy,withoutLeap){
  var bl=BREAKS.length,gy=jy+621,leapJ=-14,jp=BREAKS[0],jm,jump=0,leap,leapG,march,n,i;
  if(jy<jp||jy>=BREAKS[bl-1])throw new Error('Invalid Jalaali year '+jy);
  for(i=1;i<bl;i+=1){
    jm=BREAKS[i];jump=jm-jp;
    if(jy<jm)break;
    leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);
    jp=jm;
  }
  n=jy-jp;
  leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
  if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(withoutLeap)return {gy:gy,march:march};
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;
  leap=mod(mod(n+1,33)-1,4);
  if(leap===-1)leap=4;
  return {leap:leap,gy:gy,march:march};
}
function g2d(gy,gm,gd){
  var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
  d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  var j,i,gd,gm,gy;
  j=4*jdn+139361631;
  j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
  i=div(mod(j,1461),4)*5+308;
  gd=div(mod(i,153),5)+1;
  gm=mod(div(i,153),12)+1;
  gy=div(j,1461)-100100+div(8-gm,6);
  return {gy:gy,gm:gm,gd:gd};
}
function j2d(jy,jm,jd){
  var r=jalCal(jy,true);
  return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;
}
function d2j(jdn){
  var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy,false),jdn1f=g2d(gy,3,r.march),jd,jm,k;
  k=jdn-jdn1f;
  if(k>=0){
    if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return {jy:jy,jm:jm,jd:jd};}
    k-=186;
  }else{
    jy-=1;k+=179;
    if(r.leap===1)k+=1;
  }
  jm=7+div(k,30);jd=mod(k,30)+1;
  return {jy:jy,jm:jm,jd:jd};
}
function toJalali(gy,gm,gd){var r=d2j(g2d(gy,gm,gd));return [r.jy,r.jm,r.jd];}
function toGregorian(jy,jm,jd){var r=d2g(j2d(jy,jm,jd));return [r.gy,r.gm,r.gd];}
function isJLeap(jy){return jalCal(jy,false).leap===0;}
function jDays(jy,jm){return jm<=6?31:(jm<=11?30:(isJLeap(jy)?30:29));}
function p2(n){return (n<10?'0':'')+n;}
function normJDate(s){
  var t=toEn(s).trim().split(/[\/\-\.]/);
  if(t.length!==3)return null;
  for(var i=0;i<3;i++){if(!/^\d+$/.test(t[i]))return null;}
  var y=+t[0],m=+t[1],d=+t[2];
  if(!(y>=1300&&y<=1500)||!(m>=1&&m<=12)||!(d>=1&&d<=jDays(y,m)))return null;
  return y+'/'+p2(m)+'/'+p2(d);
}
function jKey(s){var n=normJDate(s);return n?+n.replace(/\//g,''):0;}
function todayJ(now){var n=now||new Date();var r=toJalali(n.getFullYear(),n.getMonth()+1,n.getDate());return r[0]+'/'+p2(r[1])+'/'+p2(r[2]);}
var MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function periodLabel(ym){var p=ym.split('/');return MONTHS[+p[1]-1]+' '+toFa(p[0]);}

var W1=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
var W10=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
var W20=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
var W100=['','یکصد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
var WS=['','هزار','میلیون','میلیارد','هزار میلیارد'];
function words3(n){
  var p=[],h=Math.floor(n/100),r=n%100;
  if(h)p.push(W100[h]);
  if(r){
    if(r<10)p.push(W1[r]);
    else if(r<20)p.push(W10[r-10]);
    else{var t=Math.floor(r/10),o=r%10;p.push(W20[t]);if(o)p.push(W1[o]);}
  }
  return p.join(' و ');
}
function numWords(n){
  n=Math.round(+n||0);
  if(n===0)return 'صفر';
  var neg=n<0;n=Math.abs(n);
  var parts=[],i=0;
  while(n>0){
    var g=n%1000;
    if(g)parts.unshift(words3(g)+(WS[i]?' '+WS[i]:''));
    n=Math.floor(n/1000);i++;
  }
  return (neg?'منفی ':'')+parts.join(' و ');
}

function calcLine(it,vatRate){
  var qty=+it.qty||0,up=+it.unitPrice||0;
  var total=Math.round(qty*up);
  var disc=Math.min(Math.max(Math.round(+it.discount||0),0),total);
  var after=total-disc;
  var vat=Math.round(after*(+vatRate||0)/100);
  return {total:total,disc:disc,after:after,vat:vat,grand:after+vat};
}
function calcDoc(doc){
  var rows=doc.items.map(function(it){return calcLine(it,doc.vatRate);});
  function sum(k){return rows.reduce(function(a,r){return a+r[k];},0);}
  var t={total:sum('total'),disc:sum('disc'),after:sum('after'),vat:sum('vat'),grand:sum('grand')};
  var base=doc.shareBase==='total'?t.grand:t.after;
  t.friend=Math.round(base*(+doc.shareRate||0)/100);
  t.mine=t.grand-t.vat-t.friend;
  return {rows:rows,t:t};
}

var DEFAULTS={

function docGrand(d){return calcDoc(d).t.grand;}
function custAccount(cid,docs,pays){
  var invs=[],ps=[],unalloc=0,ids={},paidBy={};
  docs.forEach(function(d){if(d.type==='invoice'&&d.customerId===cid){invs.push(d);ids[d.id]=true;}});
  invs.sort(function(a,b){return (jKey(a.date)-jKey(b.date))||(parseNum(a.serial)-parseNum(b.serial));});
  pays.forEach(function(p){if(p.customerId===cid)ps.push(p);});
  ps.sort(function(a,b){return (jKey(a.date)-jKey(b.date))||((a.createdAt||0)-(b.createdAt||0));});
  ps.forEach(function(p){
    var amt=+p.amount||0;
    if(p.invoiceId&&ids[p.invoiceId])paidBy[p.invoiceId]=(paidBy[p.invoiceId]||0)+amt;else unalloc+=amt;
  });
  var billed=0,paid=0;
  var rows=invs.map(function(d){var g=docGrand(d),pd=paidBy[d.id]||0;billed+=g;paid+=pd;return {doc:d,grand:g,paid:pd,bal:g-pd};});
  paid+=unalloc;
  var ledger=[];
  invs.forEach(function(d){ledger.push({date:d.date,t:0,ord:parseNum(d.serial),kind:'inv',id:d.id,debit:docGrand(d),credit:0});});
  ps.forEach(function(p){ledger.push({date:p.date,t:1,ord:p.createdAt||0,kind:'pay',id:p.id,debit:0,credit:+p.amount||0,p:p});});
  ledger.sort(function(a,b){return (jKey(a.date)-jKey(b.date))||(a.t-b.t)||(a.ord-b.ord);});
  var run=0;ledger.forEach(function(e){run+=e.debit-e.credit;e.run=run;});
  return {invoices:rows,payments:ps,billed:billed,paid:paid,unallocated:unalloc,balance:billed-paid,ledger:ledger};
}

async function savePay(){

async function saveDraft(){
  var d=draft,date=normJDate(d.date);
  if(!date){toast('تاریخ معتبر نیست؛ مثل ۱۴۰۵/۰۷/۲۷ وارد کنید','err');return;}
  if(!d.customerId||!d.buyer){toast('خریدار را انتخاب کنید','err');return;}
  var serial=toEn(d.serial).trim();
  if(!serial){toast('شماره سریال را وارد کنید','err');return;}
  var dup=false;S.docs.forEach(function(x){if(x.id!==d.id&&x.type===d.type&&String(x.serial)===serial)dup=true;});
  if(dup){toast('این شماره سریال قبلاً برای '+(d.type==='invoice'?'فاکتور':'پیش‌فاکتور')+' دیگری ثبت شده','err');return;}
  var items=d.items.filter(function(it){return String(it.desc).trim()||it.unitPrice>0;}).map(function(it){return {code:String(it.code).trim(),desc:String(it.desc).trim(),qty:parseNum(it.qty),unit:String(it.unit).trim(),unitPrice:Math.round(it.unitPrice||0),discount:Math.round(it.discount||0)};});
  if(!items.length){toast('حداقل یک ردیف کالا یا خدمات وارد کنید','err');return;}
  if(items.some(function(it){return !it.desc;})){toast('شرح کالا یا خدمات را بنویسید','err');return;}
  if(items.some(function(it){return !(it.qty>0);})){toast('تعداد باید بیشتر از صفر باشد','err');return;}
  var prev=d.id?(S.docs.get(d.id)||{}):{},now=Date.now();
  var doc=Object.assign({},prev,{id:d.id||uid(),type:d.type,serial:serial,date:date,customerId:d.customerId,buyer:d.buyer,items:items,payment:d.payment==='credit'?'credit':'cash',stamp:d.stamp!==false,vatRate:+d.vatRate||0,shareRate:+d.shareRate||0,shareBase:d.shareBase==='total'?'total':'after',createdAt:prev.createdAt||now,updatedAt:now});
  S.docs.set(doc.id,doc);
  await put('docs/'+doc.id,doc);
  toast('ذخیره شد');draft=null;
  navigate({name:'view',id:doc.id});
}

function readStamp(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej();};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){rej();};
      img.onload=function(){
        var w=img.naturalWidth||1,h=img.naturalHeight||1,sc=Math.min(1,500/Math.max(w,h));
        for(var t=0;t<8;t++){
          var cv=document.createElement('canvas');
          cv.width=Math.max(1,Math.round(w*sc));cv.height=Math.max(1,Math.round(h*sc));
          var cx=cv.getContext('2d'),jpg=t>=4;
          if(jpg){cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);}
          cx.drawImage(img,0,0,cv.width,cv.height);
          var out=cv.toDataURL(jpg?'image/jpeg':'image/png',0.85);
          if(out.length<=230000){res(out);return;}
          sc*=0.75;
        }
        rej();
      };
      img.src=String(fr.result);
    };
    fr.readAsDataURL(file);
  });
}
async function setStamp(url){
  S.stamp=url||'';
  if(S.stamp)await put('settings/stamp',{img:S.stamp,updatedAt:Date.now()});else await del('settings/stamp');
  if(route.name==='settings')render();
  toast(S.stamp?'تصویر مهر و امضا ذخیره شد':'تصویر حذف شد');
}
async function saveSettings(){
  var s=setDraft;
  var o={seller:s.seller,vatRate:Math.max(0,+s.vatRate||0),shareRate:Math.min(100,Math.max(0,+s.shareRate||0)),shareBase:s.shareBase==='total'?'total':'after',nextSerial:Math.max(1,Math.round(parseNum(s.nextSerial))||1),defaultUnit:String(s.defaultUnit||'عدد').trim()||'عدد'};
  ['econ','reg','nid','postal','phone'].forEach(function(k){o.seller[k]=toEn(o.seller[k]||'').trim();});
  S.settings=mergeSettings(o);setDraft=null;
  await put('settings/main',S.settings);
  toast('تنظیمات ذخیره شد');render();
}
function exportBackup(){
  var data={app:'dafter-factor',v:1,date:todayJ(),settings:S.settings,stamp:S.stamp,customers:Array.from(S.customers.values()),catalog:Array.from(S.catalog.values()),payments:Array.from(S.payments.values()),docs:Array.from(S.docs.values())};
  saveFile('dafter-factor-backup-'+todayJ().replace(/\//g,'-')+'.json',JSON.stringify(data));
}
function importBackup(file){
  var r=new FileReader();
  r.onload=async function(){
    var j;try{j=JSON.parse(String(r.result));}catch(e){toast('فایل معتبر نیست','err');return;}
    if(!j||j.app!=='dafter-factor'||!Array.isArray(j.docs)||!Array.isArray(j.customers)){toast('این فایل پشتیبان دفتر فاکتور نیست','err');return;}
    var ok=await ask('«'+toFa(j.customers.length)+' مشتری» و «'+toFa(j.docs.length)+' سند» وارد شود؟ موارد هم‌شناسه با نسخه فایل جایگزین می‌شوند.','وارد کن');
    if(!ok)return;
    for(var i=0;i<j.customers.length;i++){var c=j.customers[i];if(c&&c.id){S.customers.set(c.id,c);await put('customers/'+c.id,c);}}
    if(Array.isArray(j.catalog)){for(var m=0;m<j.catalog.length;m++){var ci=j.catalog[m];if(ci&&ci.id){S.catalog.set(ci.id,ci);await put('catalog/'+ci.id,ci);}}}
    if(Array.isArray(j.payments)){for(var q=0;q<j.payments.length;q++){var pi=j.payments[q];if(pi&&pi.id){S.payments.set(pi.id,pi);await put('payments/'+pi.id,pi);}}}
    for(var k=0;k<j.docs.length;k++){var d=j.docs[k];if(d&&d.id){S.docs.set(d.id,d);await put('docs/'+d.id,d);}}
    if(j.settings){S.settings=mergeSettings(j.settings);await put('settings/main',S.settings);}
    if(typeof j.stamp==='string'&&/^data:image\//.test(j.stamp)&&j.stamp.length<=250000){await setStamp(j.stamp);}
    setDraft=null;toast('اطلاعات وارد شد');render();
  };
  r.readAsText(file);
}

app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var f=acts[el.dataset.act];if(f){e.preventDefault();f(el);}
});
function onField(e){
  var t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(e.type==='change'&&(f==='cq'||f==='cust-q'||f==='cat-q'||f==='catpick-q'))return;
  if(f==='cq'){refreshPicker();return;}
  if(f==='cust-q'){ui.q=t.value;var l=$('#cust-list');if(l)l.innerHTML=custListHTML(ui.q,'open-stmt',true);return;}
  if(f==='period'){ui.period=t.value;render();return;}
  if(route.name==='payment'&&payDraft&&f.indexOf('p.')===0){
    var pk=f.slice(2);
    if(pk==='amount'){var pn=Math.max(0,Math.round(parseNum(t.value)));payDraft.amount=pn;var ps=pn?fmt(pn):'';if(t.value!==ps)t.value=ps;}
    else if(pk==='invoiceId'){payDraft.invoiceId=t.value;var ph=$('#pay-hint');if(ph)ph.innerHTML=payHintHTML();}
    else payDraft[pk]=t.value;
    return;
  }
  if(f==='catpick-q'){var pl=$('#catpick-list');if(pl)pl.innerHTML=catListHTML(t.value,'cat-choose');return;}
  if(f==='cat-q'){ui.cq=t.value;var cl=$('#cat-list');if(cl)cl.innerHTML=catListHTML(ui.cq,'edit-cat');return;}
  if(route.name==='catitem'&&catDraft&&f.indexOf('ci.')===0){
    var ck=f.slice(3);
    if(ck==='unitPrice'){var cn=Math.max(0,Math.round(parseNum(t.value)));catDraft[ck]=cn;var cs=cn?fmt(cn):'';if(t.value!==cs)t.value=cs;}
    else catDraft[ck]=t.value;
    return;
  }
  if(route.name==='edit'&&draft){editorInput(t,f);return;}
  if(route.name==='customer'&&custDraft&&f.indexOf('c.')===0){custDraft[f.slice(2)]=t.value;return;}
  if(route.name==='settings'&&setDraft){
    if(f.indexOf('sl.')===0)setDraft.seller[f.slice(3)]=t.value;
    else if(f.indexOf('s.')===0){var k=f.slice(2);setDraft[k]=(k==='vatRate'||k==='shareRate')?parseNum(t.value):t.value;}
  }
}
app.addEventListener('input',onField);
app.addEventListener('change',onField);
$('#imp').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(f)importBackup(f);e.target.value='';});
$('#stampfile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';
  if(!f)return;
  if(!/^image\//.test(f.type)){toast('فقط فایل تصویری انتخاب کنید','err');return;}
  readStamp(f).then(setStamp).catch(function(){toast('این تصویر خوانده نشد؛ تصویر دیگری امتحان کنید','err');});
});

/* ---------- start ---------- */
function printNow(stmt){
  document.body.classList.toggle('pr-stmt',!!stmt);
  var done=function(){document.body.classList.remove('pr-stmt');window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  try{window.print();}catch(e){toast('چاپ در این دستگاه پشتیبانی نمی‌شود؛ از «ذخیره فایل» استفاده کنید','err');done();}
}
function dlShim(){
  return {save:function(o){
    return new Promise(function(res,rej){
      try{
        var blob=(o.data instanceof Blob)?o.data:new Blob([o.data],{type:/\.json$/i.test(o.filename)?'application/json':'text/html;charset=utf-8'});
        var u=URL.createObjectURL(blob),a=document.createElement('a');
        a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(u);},4000);
        res({status:'saved'});
      }catch(e){rej({code:'unavailable'});}
    });
  }};
}
function setupBack(){
  try{
    history.replaceState({a:1},'');history.pushState({a:2},'');
    window.__nav=function(){if(history.state&&history.state.a===1)history.pushState({a:2},'');};
    window.addEventListener('popstate',function(){
      var m=$('.modal');
      if(m){m.remove();history.pushState({a:2},'');return;}
      var r=route.name;
      if(r==='edit')acts['edit-back']();
      else if(r==='customer')acts['cust-back']();
      else if(r==='payment')acts['pay-back']();
      else if(r==='catitem')acts['cat-back']();
      else if(r==='view')navigate({name:'docs'});
      else if(r==='statement')navigate({name:'customers'});
      else if(r!=='docs')navigate({name:'docs'});
    });
  }catch(e){}
}
async function init(){
  render();
  downloads=dlShim();
  mode=localOK()?'local':'memory';
  if(mode==='local')loadLocal();
  renderBanner();onData();
  setupBack();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js');}catch(e){}
}
init();
})();
